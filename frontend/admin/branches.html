<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Beauty Salon - Branch Management">
    <title>Branches | The Beauty Salon Admin</title>
    <link rel="icon" type="image/png" href="../assets/images/logo/beauty-salon-logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        :root {
            --black: #000;
            --dark: #0b0b0b;
            --dark2: #111;
            --dark3: #171717;
            --dark4: #1e1e1e;
            --gold: #d4af37;
            --gold-light: #e5c65a;
            --gold-soft: rgba(212,175,55,.12);
            --gold-border: rgba(212,175,55,.25);
            --white: #fff;
            --text: #eee;
            --muted: #999;
            --muted2: #686868;
            --green: #4ade80;
            --orange: #f59e0b;
            --red: #ef4444;
            --header-height: 78px;
            --sidebar-width: 255px;
            --sidebar-collapsed: 78px;
            --transition: .28s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100%;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar,
        .sidebar-inner::-webkit-scrollbar,
        .modal::-webkit-scrollbar { display: none; width: 0; height: 0; }

        body {
            font-family: "DM Sans", sans-serif;
            background: var(--black);
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.5;
        }

        a { color: inherit; text-decoration: none; }
        button, input, select, textarea { font-family: inherit; }
        button { cursor: pointer; }

        /* HEADER */
        .admin-header {
            position: fixed;
            inset: 0 0 auto 0;
            width: 100%;
            height: var(--header-height);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: rgba(8,8,8,.98);
            border-bottom: 1px solid var(--gold-border);
            box-shadow: 0 5px 25px rgba(0,0,0,.35);
        }

        .header-left {
            height: 100%;
            display: flex;
            align-items: center;
            gap: 24px;
            min-width: 0;
        }

        .admin-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 205px;
            flex-shrink: 0;
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            background: var(--gold-soft);
            border: 1px solid var(--gold);
            box-shadow: 0 0 0 4px rgba(212,175,55,.04);
        }

        .brand-text { display: flex; flex-direction: column; line-height: 1; }
        .brand-main {
            font-family: "Playfair Display", serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--white);
        }

        .brand-admin {
            margin-top: 5px;
            font-size: 9px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 2.2px;
        }

        .header-divider {
            width: 1px;
            height: 30px;
            background: rgba(255,255,255,.1);
        }

        .page-heading h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--white);
        }

        .page-heading span {
            display: block;
            margin-top: 2px;
            font-size: 13px;
            color: var(--muted);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .notification-btn,
        .mobile-sidebar-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .notification-btn {
            position: relative;
            border: 1px solid rgba(255,255,255,.1);
            background: var(--dark3);
            color: var(--muted);
        }

        .notification-btn:hover {
            color: var(--gold);
            border-color: var(--gold-border);
            background: var(--gold-soft);
        }

        .notification-dot {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--gold);
            border: 2px solid var(--dark3);
        }

        .admin-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-left: 16px;
            border-left: 1px solid rgba(255,255,255,.1);
        }

        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #181818;
            border: 1px solid var(--gold-border);
            color: var(--gold);
        }

        .profile-info { display: flex; flex-direction: column; gap: 2px; }
        .profile-info strong { font-size: 12px; color: var(--white); }
        .profile-info span { font-size: 10px; color: var(--muted); }

        .mobile-sidebar-btn {
            display: none;
            border: 1px solid var(--gold-border);
            background: var(--dark3);
            color: var(--gold);
        }

        /* SIDEBAR */
        .admin-sidebar {
            position: fixed;
            top: var(--header-height);
            left: 0;
            bottom: 0;
            width: var(--sidebar-width);
            z-index: 900;
            background: #0a0a0a;
            border-right: 1px solid rgba(212,175,55,.16);
            transition: width var(--transition);
            overflow: visible;
        }

        .sidebar-inner {
            height: 100%;
            padding: 20px 12px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .sidebar-section-title {
            padding: 8px 12px 10px;
            font-size: 11px;
            font-weight: 700;
            color: #626262;
            letter-spacing: 1.8px;
            white-space: nowrap;
            transition: opacity var(--transition);
        }

        .sidebar-nav { display: flex; flex-direction: column; gap: 5px; }

        .sidebar-link {
            position: relative;
            height: 48px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 13px;
            border-radius: 9px;
            color: #969696;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            transition: var(--transition);
        }

        .sidebar-link i {
            width: 20px;
            min-width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar-link:hover { color: var(--white); background: rgba(255,255,255,.045); }

        .sidebar-link.active {
            color: var(--gold);
            background: var(--gold-soft);
        }

        .sidebar-link.active::before {
            content: "";
            position: absolute;
            left: -12px;
            top: 8px;
            bottom: 8px;
            width: 3px;
            border-radius: 0 4px 4px 0;
            background: var(--gold);
        }

        .sidebar-link.logout { color: #9a6767; }
        .sidebar-link.logout:hover { color: #ff8080; background: rgba(239,68,68,.07); }

        .sidebar-bottom {
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,.07);
        }

        .sidebar-collapse-btn {
            position: absolute;
            top: 18px;
            right: -14px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid var(--gold-border);
            background: #151515;
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            z-index: 950;
            transition: var(--transition);
        }

        .sidebar-collapse-btn:hover { background: var(--gold); color: var(--black); }

        body.sidebar-collapsed .admin-sidebar { width: var(--sidebar-collapsed); }
        body.sidebar-collapsed .sidebar-section-title { opacity: 0; pointer-events: none; }
        body.sidebar-collapsed .sidebar-link { justify-content: center; padding: 0; gap: 0; }
        body.sidebar-collapsed .sidebar-link span { display: none; }
        body.sidebar-collapsed .sidebar-collapse-btn i { transform: rotate(180deg); }

        body.sidebar-collapsed .sidebar-link::after {
            content: attr(data-tooltip);
            position: absolute;
            left: calc(100% + 12px);
            top: 50%;
            transform: translateY(-50%);
            padding: 7px 10px;
            border-radius: 6px;
            border: 1px solid var(--gold-border);
            background: #171717;
            color: var(--white);
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            z-index: 1200;
            transition: .15s ease;
        }

        body.sidebar-collapsed .sidebar-link:hover::after {
            opacity: 1;
            visibility: visible;
        }

        /* MAIN */
        .admin-main {
            min-height: 100vh;
            padding-top: var(--header-height);
            margin-left: var(--sidebar-width);
            background:
                radial-gradient(circle at 75% 10%, rgba(212,175,55,.035), transparent 30%),
                var(--black);
            transition: margin-left var(--transition);
        }

        body.sidebar-collapsed .admin-main { margin-left: var(--sidebar-collapsed); }

        .main-content {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 22px 34px 34px;
        }

        /* PAGE TOP */
        .page-top {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 16px;
            min-height: 44px;
        }

        .page-title h2 {
            font-family: "Playfair Display", serif;
            font-size: 34px;
            line-height: 1.2;
            color: var(--white);
            margin-bottom: 6px;
        }

        .page-title h2 span { color: var(--gold); }
        .page-title p { font-size: 14px; color: var(--muted); }

        .add-branch-btn {
            height: 46px;
            padding: 0 18px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--gold);
            border-radius: 8px;
            background: var(--gold);
            color: #090909;
            font-size: 13px;
            font-weight: 700;
            transition: var(--transition);
        }

        .add-branch-btn:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
        }

        /* TOOLBAR */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 14px 16px;
            margin-bottom: 20px;
            background: var(--dark2);
            border: 1px solid rgba(255,255,255,.075);
            border-radius: 12px;
        }

        .search-box { position: relative; width: 390px; }
        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 14px;
        }

        .search-box input {
            width: 100%;
            height: 46px;
            padding: 0 13px 0 42px;
            color: var(--white);
            background: #171717;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .search-box input::placeholder { color: #666; }
        .search-box input:focus { border-color: var(--gold-border); box-shadow: 0 0 0 3px rgba(212,175,55,.05); }

        .filter-area {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 0;
        }

        .filter-select {
            height: 46px;
            padding: 0 34px 0 13px;
            color: #aaa;
            background: #171717;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 8px;
            outline: none;
            font-size: 13px;
        }

        .filter-select:focus { border-color: var(--gold-border); }
        .toolbar-add-btn { margin-left: auto; white-space: nowrap; }

        /* BRANCH CARDS */
        .branches-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .branches-loading,
        .branches-empty,
        .branches-error {
            grid-column: 1 / -1;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--muted);
            background: var(--dark2);
            border: 1px solid rgba(255,255,255,.075);
            border-radius: 14px;
            font-size: 14px;
        }

        .branches-loading i,
        .branches-error i { color: var(--gold); font-size: 22px; }
        .branches-empty i { color: var(--muted2); font-size: 24px; }

        .branches-empty strong,
        .branches-error strong { color: #ddd; font-weight: 600; }

        .branches-error button {
            margin-top: 4px;
            height: 36px;
            padding: 0 14px;
            border: 1px solid var(--gold-border);
            border-radius: 7px;
            background: var(--gold-soft);
            color: var(--gold);
            font-size: 11px;
            font-weight: 700;
        }

        .branch-card {
            position: relative;
            background: var(--dark2);
            border: 1px solid rgba(255,255,255,.075);
            border-radius: 14px;
            overflow: hidden;
            transition: var(--transition);
        }

        .branch-card:hover {
            transform: translateY(-3px);
            border-color: var(--gold-border);
            box-shadow: 0 18px 45px rgba(0,0,0,.35);
        }

        .branch-cover {
            height: 135px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #181818, #0d0d0d);
            border-bottom: 1px solid rgba(255,255,255,.06);
        }

        .branch-cover-icon {
            width: 62px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: var(--gold);
            background: var(--gold-soft);
            border: 1px solid var(--gold-border);
            font-size: 23px;
        }

        .branch-content { padding: 20px; }

        .branch-heading {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 17px;
        }

        .branch-heading h3 {
            font-family: "Playfair Display", serif;
            font-size: 23px;
            font-weight: 600;
            line-height: 1.25;
            color: var(--white);
        }

        .branch-heading p {
            margin-top: 4px;
            font-size: 11px;
            color: var(--muted2);
        }

        .branch-badge {
            padding: 5px 9px;
            border-radius: 20px;
            color: var(--green);
            background: rgba(74,222,128,.08);
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        .branch-badge.status-closed {
            color: var(--red);
            background: rgba(239,68,68,.08);
        }

        .details-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 15px 0;
            border-top: 1px solid rgba(255,255,255,.06);
            border-bottom: 1px solid rgba(255,255,255,.06);
        }

        .detail-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .detail-row i {
            width: 18px;
            min-width: 18px;
            margin-top: 3px;
            color: var(--gold);
            font-size: 13px;
            text-align: center;
        }

        .detail-row span {
            color: #aaa;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .branch-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .action-btn {
            height: 40px;
            padding: 0 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            transition: var(--transition);
        }

        .edit-btn {
            color: var(--gold);
            background: var(--gold-soft);
            border: 1px solid var(--gold-border);
        }

        .edit-btn:hover { background: var(--gold); color: var(--black); }

        .delete-btn {
            color: #e88888;
            background: rgba(239,68,68,.06);
            border: 1px solid rgba(239,68,68,.15);
        }

        .delete-btn:hover { background: rgba(239,68,68,.15); }

        .view-btn {
            color: #aaa;
            background: #181818;
            border: 1px solid rgba(255,255,255,.08);
        }

        .view-btn:hover { color: var(--white); border-color: rgba(255,255,255,.18); }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,.78);
            backdrop-filter: blur(6px);
        }

        .modal-overlay.active { display: flex; }

        .modal {
            width: 100%;
            max-width: 620px;
            max-height: 90vh;
            overflow-y: auto;
            scrollbar-width: none;
            background: #111;
            border: 1px solid var(--gold-border);
            border-radius: 14px;
            box-shadow: 0 25px 80px rgba(0,0,0,.65);
            animation: modalIn .22s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(12px) scale(.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-header {
            min-height: 64px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,.07);
        }

        .modal-title h3 { font-size: 15px; color: var(--white); }
        .modal-title span { display: block; margin-top: 3px; color: var(--muted2); font-size: 10px; }

        .modal-close {
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 7px;
            background: #181818;
            color: #888;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover { color: var(--white); border-color: var(--gold-border); }

        .modal-body { padding: 20px; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group { display: flex; flex-direction: column; gap: 7px; }
        .form-group.full { grid-column: 1 / -1; }

        .form-group label {
            color: #aaa;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            color: var(--white);
            background: #181818;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 8px;
            outline: none;
            font-size: 13px;
        }

        .form-group input,
        .form-group select {
            height: 42px;
            padding: 0 11px;
        }

        .form-group textarea {
            min-height: 90px;
            padding: 11px;
            resize: vertical;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder { color: #666; }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--gold-border);
            box-shadow: 0 0 0 3px rgba(212,175,55,.05);
        }

        .modal-footer {
            padding: 15px 20px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            border-top: 1px solid rgba(255,255,255,.07);
        }

        .modal-btn {
            height: 42px;
            padding: 0 16px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
        }

        .cancel-btn {
            color: #aaa;
            background: #181818;
            border: 1px solid rgba(255,255,255,.08);
        }

        .save-btn {
            color: var(--black);
            background: var(--gold);
            border: 1px solid var(--gold);
        }

        .save-btn:hover { background: var(--gold-light); }

        /* MOBILE OVERLAY */
        .sidebar-overlay { display: none; }

        /* TABLET */
        @media (max-width: 1050px) {
            :root { --sidebar-width: 225px; }
            .branches-grid { grid-template-columns: 1fr; }
            .main-content { padding: 20px 28px 28px; }
            .search-box { width: 320px; }
        }

        /* SMALL TABLET */
        @media (max-width: 850px) {
            .admin-header { padding: 0 18px; }
            .header-left { gap: 15px; }
            .header-divider, .page-heading { display: none; }
            .mobile-sidebar-btn { display: flex; }

            .admin-sidebar {
                width: 275px;
                transform: translateX(-100%);
                transition: transform var(--transition);
                box-shadow: 15px 0 40px rgba(0,0,0,.5);
            }

            body.mobile-sidebar-open .admin-sidebar { transform: translateX(0); }
            .sidebar-collapse-btn { display: none; }

            .admin-main,
            body.sidebar-collapsed .admin-main { margin-left: 0; }

            body.sidebar-collapsed .admin-sidebar { width: 275px; }
            body.sidebar-collapsed .sidebar-link {
                justify-content: flex-start;
                padding: 0 12px;
                gap: 13px;
            }

            body.sidebar-collapsed .sidebar-link span { display: inline; }
            body.sidebar-collapsed .sidebar-section-title { opacity: 1; pointer-events: auto; }
            body.sidebar-collapsed .sidebar-link::after { display: none; }

            .sidebar-overlay {
                position: fixed;
                top: var(--header-height);
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 850;
                background: rgba(0,0,0,.65);
                backdrop-filter: blur(2px);
            }

            body.mobile-sidebar-open .sidebar-overlay { display: block; }

            .main-content { padding: 18px 22px 26px; }
            .toolbar { align-items: stretch; }
            .search-box { width: 100%; }
            .filter-area { flex-wrap: wrap; }
            .filter-select, .toolbar-add-btn {
                flex: 1;
                min-width: 150px;
            }
        }

        /* MOBILE */
        @media (max-width: 600px) {
            :root { --header-height: 68px; }

            .admin-header {
                height: var(--header-height);
                padding: 0 13px;
            }

            .admin-sidebar,
            .sidebar-overlay { top: var(--header-height); }

            .admin-brand {
                min-width: auto;
                gap: 9px;
            }

            .brand-logo { width: 39px; height: 39px; font-size: 15px; }
            .brand-main { font-size: 16px; }
            .brand-admin { font-size: 8px; letter-spacing: 1.8px; }

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const API = "https://thebeautysalon.onrender.com/api/branches";

            const body = document.body;
            const sidebarCollapseBtn = document.getElementById("sidebarCollapseBtn");
            const mobileSidebarBtn = document.getElementById("mobileSidebarBtn");
            const sidebarOverlay = document.getElementById("sidebarOverlay");

            const addBranchBtn = document.getElementById("addBranchBtn");
            const modal = document.getElementById("branchModal");
            const closeModalBtn = document.getElementById("closeModal");
            const cancelModalBtn = document.getElementById("cancelModal");
            const branchForm = document.getElementById("branchForm");
            const modalTitle = document.getElementById("modalTitle");

            const searchInput = document.getElementById("branchSearch");
            const statusFilter = document.getElementById("statusFilter");
            const branchesGrid = document.getElementById("branchesGrid");
            const saveBtn = document.querySelector(".save-btn");

            let branches = [];
            let editingBranch = null;
            let viewingBranch = false;

            const fields = {
                name: document.getElementById("branchName"),
                status: document.getElementById("branchStatus"),
                address: document.getElementById("branchAddress"),
                phone: document.getElementById("branchPhone"),
                phone2: document.getElementById("branchPhone2"),
                email: document.getElementById("branchEmail"),
                hours: document.getElementById("branchHours")
            };

            function escapeHtml(value) {
                return String(value ?? "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            function normalizeStatus(branch) {
                if (branch.is_active !== undefined && branch.is_active !== null) {
                    return Number(branch.is_active) === 1 ? "open" : "closed";
                }

                const raw = String(branch.status ?? "").toLowerCase();
                return ["open", "active", "1", "true"].includes(raw)
                    ? "open"
                    : "closed";
            }

            function formatTime(value) {
                if (!value) return "";
                const text = String(value).substring(0, 5);
                const parts = text.split(":");
                if (parts.length !== 2) return String(value);
                let hour = Number(parts[0]);
                const minute = parts[1];
                const suffix = hour >= 12 ? "PM" : "AM";
                hour = hour % 12 || 12;
                return `${hour}:${minute} ${suffix}`;
            }

            function formatHours(branch) {
                const open = branch.opening_time || branch.openingTime;
                const close = branch.closing_time || branch.closingTime;
                if (open || close) {
                    return `${formatTime(open) || "—"} – ${formatTime(close) || "—"}`;
                }
                return "Hours not set";
            }

            function renderBranches() {
                const search = searchInput.value.trim().toLowerCase();
                const filter = statusFilter.value;

                const filtered = branches.filter(branch => {
                    const name = String(branch.name || "").toLowerCase();
                    const address = String(branch.address || "").toLowerCase();
                    const status = normalizeStatus(branch);

                    return (name.includes(search) || address.includes(search)) &&
                           (filter === "all" || status === filter);
                });

                if (!filtered.length) {
                    branchesGrid.innerHTML = `
                        <div class="branches-empty">
                            <i class="fa-regular fa-building"></i>
                            <strong>No branches found</strong>
                            <span>Try another search or add a new branch.</span>
                        </div>`;
                    return;
                }

                branchesGrid.innerHTML = filtered.map(branch => {
                    const status = normalizeStatus(branch);
                    const isOpen = status === "open";

                    return `
                        <article class="branch-card"
                            data-id="${escapeHtml(branch.id)}"
                            data-name="${escapeHtml(branch.name).toLowerCase()}"
                            data-status="${status}">

                            <div class="branch-cover">
                                <div class="branch-cover-icon">
                                    <i class="fa-solid ${isOpen ? "fa-location-dot" : "fa-building"}"></i>
                                </div>
                            </div>

                            <div class="branch-content">
                                <div class="branch-heading">
                                    <div>
                                        <h3>${escapeHtml(branch.name || "Unnamed Branch")}</h3>
                                        <p>${branch.id ? `Branch ID: ${escapeHtml(branch.id)}` : "Salon Branch"}</p>
                                    </div>
                                    <span class="branch-badge ${isOpen ? "" : "status-closed"}">
                                        ${isOpen ? "Open" : "Closed"}
                                    </span>
                                </div>

                                <div class="details-list">
                                    <div class="detail-row">
                                        <i class="fa-solid fa-location-dot"></i>
                                        <span>${escapeHtml(branch.address || "Address not available")}</span>
                                    </div>

                                    <div class="detail-row">
                                        <i class="fa-solid fa-phone"></i>
                                        <span>${escapeHtml(branch.phone || "Phone not available")}</span>
                                    </div>

                                    <div class="detail-row">
                                        <i class="fa-solid fa-envelope"></i>
                                        <span>${escapeHtml(branch.email || "Email not available")}</span>
                                    </div>

                                    <div class="detail-row">
                                        <i class="fa-regular fa-clock"></i>
                                        <span>${escapeHtml(formatHours(branch))}</span>
                                    </div>
                                </div>

                                <div class="branch-actions">
                                    <button class="action-btn edit-btn edit-branch" data-id="${escapeHtml(branch.id)}">
                                        <i class="fa-solid fa-pen"></i> Edit
                                    </button>

                                    <button class="action-btn view-btn" data-id="${escapeHtml(branch.id)}">
                                        <i class="fa-regular fa-eye"></i> View
                                    </button>

                                    <button class="action-btn delete-btn delete-branch" data-id="${escapeHtml(branch.id)}">
                                        <i class="fa-regular fa-trash-can"></i> Delete
                                    </button>
                                </div>
                            </div>
                        </article>`;
                }).join("");

                document.querySelectorAll(".edit-branch").forEach(btn =>
                    btn.addEventListener("click", () => {
                        const branch = branches.find(b => String(b.id) === String(btn.dataset.id));
                        if (branch) openEditModal(branch);
                    })
                );

                document.querySelectorAll(".view-btn").forEach(btn =>
                    btn.addEventListener("click", () => {
                        const branch = branches.find(b => String(b.id) === String(btn.dataset.id));
                        if (branch) openViewModal(branch);
                    })
                );

                document.querySelectorAll(".delete-branch").forEach(btn =>
                    btn.addEventListener("click", () => deleteBranch(btn.dataset.id))
                );
            }

            async function loadBranches() {
                branchesGrid.innerHTML = `
                    <div class="branches-loading">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        <span>Loading branches...</span>
                    </div>`;

                try {
                    const response = await fetch(API);
                    const result = await response.json();

                    if (!response.ok || result.success === false) {
                        throw new Error(result.message || "Failed to load branches.");
                    }

                    branches = Array.isArray(result)
                        ? result
                        : (result.data || result.branches || []);

                    renderBranches();

                } catch (error) {
                    console.error("Branches load error:", error);

                    branchesGrid.innerHTML = `
                        <div class="branches-error">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <strong>Unable to load branches</strong>
                            <span>Make sure the backend is running on port 5000.</span>
                            <button type="button" id="retryBranches">Retry</button>
                        </div>`;

                    document.getElementById("retryBranches")
                        ?.addEventListener("click", loadBranches);
                }
            }

            function setFormDisabled(disabled) {
                Object.values(fields).forEach(field => {
                    if (field) field.disabled = disabled;
                });
                saveBtn.style.display = disabled ? "none" : "inline-flex";
            }

            function openModal(mode, branch = null) {
                viewingBranch = mode === "view";
                editingBranch = mode === "edit" ? branch : null;

                modal.classList.add("active");
                document.body.style.overflow = "hidden";

                if (mode === "add") {
                    modalTitle.textContent = "Add New Branch";
                    branchForm.reset();
                    fields.status.value = "open";
                    setFormDisabled(false);
                } else {
                    modalTitle.textContent = mode === "view" ? "View Branch" : "Edit Branch";

                    fields.name.value = branch?.name || "";
                    fields.status.value = normalizeStatus(branch);
                    fields.address.value = branch?.address || "";
                    fields.phone.value = branch?.phone || "";
                    fields.phone2.value = "";
                    fields.email.value = branch?.email || "";
                    fields.hours.value = formatHours(branch);

                    setFormDisabled(mode === "view");
                }
            }

            function openEditModal(branch) {
                openModal("edit", branch);
            }

            function openViewModal(branch) {
                openModal("view", branch);
            }

            function closeModal() {
                modal.classList.remove("active");
                document.body.style.overflow = "";
                editingBranch = null;
                viewingBranch = false;
                setFormDisabled(false);
            }

            function parseHours() {
                const value = fields.hours.value.trim();
                const match = value.match(
                    /^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?\s*[-–]\s*(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?$/i
                );

                if (!match) return { opening_time: "09:00:00", closing_time: "21:00:00" };

                function to24(hour, minute, period) {
                    hour = Number(hour);
                    minute = minute || "00";
                    if (period) {
                        const p = period.toUpperCase();
                        if (p === "PM" && hour !== 12) hour += 12;
                        if (p === "AM" && hour === 12) hour = 0;
                    }
                    return `${String(hour).padStart(2, "0")}:${minute}:00`;
                }

                return {
                    opening_time: to24(match[1], match[2], match[3]),
                    closing_time: to24(match[4], match[5], match[6])
                };
            }

            async function saveBranch(event) {
                event.preventDefault();

                if (viewingBranch) return;

                const name = fields.name.value.trim();
                const address = fields.address.value.trim();

                if (!name) {
                    alert("Please enter branch name.");
                    fields.name.focus();
                    return;
                }

                if (!address) {
                    alert("Please enter branch address.");
                    fields.address.focus();
                    return;
                }

                const times = parseHours();
                const isActive = fields.status.value === "open" ? 1 : 0;

                const payload = {
                    name,
                    address,
                    phone: fields.phone.value.trim() || null,
                    email: fields.email.value.trim() || null,
                    opening_time: times.opening_time,
                    closing_time: times.closing_time,

                    // Supports current is_active schema and older status-based API.
                    is_active: isActive,
                    status: isActive ? "OPEN" : "CLOSED"
                };

                const isEdit = !!editingBranch;
                const url = isEdit ? `${API}/${editingBranch.id}` : API;

                try {
                    saveBtn.disabled = true;
                    saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

                    const response = await fetch(url, {
                        method: isEdit ? "PUT" : "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json().catch(() => ({}));

                    if (!response.ok || result.success === false) {
                        throw new Error(result.message || "Unable to save branch.");
                    }

                    closeModal();
                    await loadBranches();
                    alert(isEdit ? "Branch updated successfully." : "Branch added successfully.");

                } catch (error) {
                    console.error("Save branch error:", error);
                    alert(error.message || "Failed to save branch.");
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = '<i class="fa-solid fa-check"></i> Save Branch';
                }
            }

            async function deleteBranch(id) {
                const branch = branches.find(b => String(b.id) === String(id));
                if (!branch) return;

                const confirmed = confirm(
                    `Are you sure you want to delete "${branch.name}" branch?\n\nThis action cannot be undone.`
                );

                if (!confirmed) return;

                try {
                    const response = await fetch(`${API}/${id}`, {
                        method: "DELETE"
                    });

                    const result = await response.json().catch(() => ({}));

                    if (!response.ok || result.success === false) {
                        throw new Error(result.message || "Unable to delete branch.");
                    }

                    await loadBranches();
                    alert("Branch deleted successfully.");

                } catch (error) {
                    console.error("Delete branch error:", error);
                    alert(
                        error.message ||
                        "Unable to delete branch. It may be linked to existing staff or bookings."
                    );
                }
            }

            // Desktop sidebar collapse
            sidebarCollapseBtn.addEventListener("click", function () {
                body.classList.toggle("sidebar-collapsed");

                const collapsed = body.classList.contains("sidebar-collapsed");
                sidebarCollapseBtn.setAttribute(
                    "aria-label",
                    collapsed ? "Expand sidebar" : "Collapse sidebar"
                );
            });

            // Mobile sidebar
            mobileSidebarBtn.addEventListener("click", function () {
                body.classList.add("mobile-sidebar-open");
                mobileSidebarBtn.setAttribute("aria-expanded", "true");
                mobileSidebarBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            });

            function closeMobileSidebar() {
                body.classList.remove("mobile-sidebar-open");
                mobileSidebarBtn.setAttribute("aria-expanded", "false");
                mobileSidebarBtn.innerHTML = '<i class="fa-solid fa-bars"></i>';
            }

            sidebarOverlay.addEventListener("click", closeMobileSidebar);

            document.querySelectorAll(".sidebar-link").forEach(link => {
                link.addEventListener("click", function () {
                    if (window.innerWidth <= 850) closeMobileSidebar();
                });
            });

            addBranchBtn.addEventListener("click", () => openModal("add"));
            closeModalBtn.addEventListener("click", closeModal);
            cancelModalBtn.addEventListener("click", closeModal);
            branchForm.addEventListener("submit", saveBranch);

            modal.addEventListener("click", event => {
                if (event.target === modal) closeModal();
            });

            searchInput.addEventListener("input", renderBranches);
            statusFilter.addEventListener("change", renderBranches);

            document.addEventListener("keydown", event => {
                if (event.key === "Escape") {
                    closeModal();
                    closeMobileSidebar();
                }
            });

            window.addEventListener("resize", () => {
                if (window.innerWidth > 850) closeMobileSidebar();
            });

            document.getElementById("logoutBtn").addEventListener("click", function (event) {
                event.preventDefault();

                if (confirm("Are you sure you want to logout?")) {
                    window.adminLogout();
                }
            });

            loadBranches();

        });

    </script>

</body>
</html>
