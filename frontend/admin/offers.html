<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Offers Management | The Beauty Salon Admin</title>

    <link rel="icon" type="image/png" href="../assets/images/logo/beauty-salon-logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="admin-auth.js"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            scrollbar-width: none;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar,
        *::-webkit-scrollbar {
            display: none;
        }

        body {
            font-family: "DM Sans", sans-serif;
            background: #0b0b0b;
            color: #ffffff;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        :root{
  --black:#050505;
  --dark:#0b0b0b;
  --dark2:#111;
  --dark3:#171717;
  --gold:#d4af37;
  --gold-light:#e5c65a;
  --gold-soft:rgba(212,175,55,.11);
  --gold-border:rgba(212,175,55,.24);
  --white:#fff;
  --text:#e9e9e9;
  --muted:#999;
  --muted2:#666;
  --green:#4ade80;
  --orange:#f59e0b;
  --red:#ef4444;
  --blue:#60a5fa;
  --header-height:78px;
  --sidebar-width:255px;
  --sidebar-collapsed:78px;
  --transition:.22s ease;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,
.sidebar-inner::-webkit-scrollbar,.table-wrapper::-webkit-scrollbar,
.modal::-webkit-scrollbar{display:none}
body{
  font-family:"DM Sans",sans-serif;
  background:var(--black);
  color:var(--text);
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}


/* ================= HEADER ================= */
.admin-header{
  position:fixed;
  inset:0 0 auto 0;
  width:100%;
  height:var(--header-height);
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  background:rgba(8,8,8,.98);
  border-bottom:1px solid var(--gold-border);
  box-shadow:0 5px 25px rgba(0,0,0,.35);
}
.header-left{height:100%;display:flex;align-items:center;gap:24px;min-width:0}
.admin-brand{display:flex;align-items:center;gap:12px;min-width:205px;flex-shrink:0}
.brand-logo{
  width:45px;height:45px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);background:var(--gold-soft);
  border:1px solid var(--gold);
}
.brand-text{display:flex;flex-direction:column;line-height:1}
.brand-main{font-family:"Playfair Display",serif;font-size:18px;font-weight:600;color:#fff}
.brand-admin{margin-top:5px;color:var(--gold);font-size:9px;font-weight:700;letter-spacing:2.3px}
.header-divider{width:1px;height:30px;background:rgba(255,255,255,.1)}
.page-heading h1{font-size:18px;font-weight:600;color:#fff}
.page-heading span{display:block;margin-top:3px;color:var(--muted);font-size:12px}
.header-right{display:flex;align-items:center;gap:16px;flex-shrink:0}
.notification-btn{
  position:relative;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  color:#aaa;background:#171717;border:1px solid rgba(255,255,255,.1);
  border-radius:10px;transition:var(--transition);
}
.notification-btn:hover{color:var(--gold);background:var(--gold-soft);border-color:var(--gold-border)}
.notification-dot{
  position:absolute;top:7px;right:7px;width:7px;height:7px;
  border-radius:50%;background:var(--gold);border:2px solid #171717;
}
.admin-profile{display:flex;align-items:center;gap:10px;padding-left:15px;border-left:1px solid rgba(255,255,255,.1)}
.profile-avatar{
  width:39px;height:39px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#181818;border:1px solid var(--gold-border);color:var(--gold)
}
.profile-info{display:flex;flex-direction:column;gap:2px}
.profile-info strong{color:#fff;font-size:12px}
.profile-info span{color:var(--muted);font-size:10px}
.mobile-sidebar-btn{
  display:none;width:40px;height:40px;align-items:center;justify-content:center;
  color:var(--gold);background:#171717;border:1px solid var(--gold-border);border-radius:10px;
}

/* ================= SIDEBAR ================= */
.admin-sidebar{
  position:fixed;top:var(--header-height);left:0;bottom:0;
  width:var(--sidebar-width);z-index:900;
  background:#0a0a0a;border-right:1px solid rgba(212,175,55,.16);
  transition:width var(--transition);overflow:visible;
}
.sidebar-inner{height:100%;padding:18px 12px;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none}
.sidebar-section-title{
  padding:8px 12px 10px;color:#626262;font-size:9px;font-weight:700;
  letter-spacing:1.8px;white-space:nowrap;transition:opacity var(--transition)
}
.sidebar-nav{display:flex;flex-direction:column;gap:5px}
.sidebar-link{
  position:relative;height:45px;padding:0 12px;
  display:flex;align-items:center;gap:13px;border-radius:9px;
  color:#969696;font-size:12px;font-weight:500;white-space:nowrap;
  transition:var(--transition)
}
.sidebar-link i{width:20px;min-width:20px;text-align:center;font-size:14px}
.sidebar-link:hover{color:#fff;background:rgba(255,255,255,.045)}
.sidebar-link.active{color:var(--gold);background:var(--gold-soft)}
.sidebar-link.active::before{
  content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;
  border-radius:0 4px 4px 0;background:var(--gold)
}
.sidebar-link.logout{color:#9a6767}
.sidebar-link.logout:hover{color:#ff8080;background:rgba(239,68,68,.07)}
.sidebar-bottom{margin-top:auto;padding-top:15px;border-top:1px solid rgba(255,255,255,.07)}
.sidebar-collapse-btn{
  position:absolute;top:18px;right:-14px;width:28px;height:28px;
  border-radius:50%;border:1px solid var(--gold-border);background:#151515;color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:10px;z-index:950;
  transition:var(--transition)
}
.sidebar-collapse-btn:hover{color:#000;background:var(--gold)}

body.sidebar-collapsed .admin-sidebar{width:var(--sidebar-collapsed)}
body.sidebar-collapsed .sidebar-section-title{opacity:0;pointer-events:none}
body.sidebar-collapsed .sidebar-link{justify-content:center;padding:0;gap:0}
body.sidebar-collapsed .sidebar-link span{display:none}
body.sidebar-collapsed .sidebar-collapse-btn i{transform:rotate(180deg)}
body.sidebar-collapsed .sidebar-link::after{
  content:attr(data-tooltip);position:absolute;left:calc(100% + 12px);top:50%;
  transform:translateY(-50%);padding:7px 10px;color:#fff;background:#171717;
  border:1px solid var(--gold-border);border-radius:6px;font-size:10px;white-space:nowrap;
  opacity:0;visibility:hidden;pointer-events:none;z-index:1200;transition:.15s ease
}
body.sidebar-collapsed .sidebar-link:hover::after{opacity:1;visibility:visible}

/* ==========================================
           MAIN
        ========================================== */

        .admin-main {
            margin-left: 245px;
            padding: 108px 30px 40px;
            min-height: 100vh;
            transition: margin-left 0.25s ease;
        }

        .admin-sidebar.collapsed ~ .admin-main {
            margin-left: 76px;
        }

        /* ==========================================
           PAGE HEADING
        ========================================== */

        .content-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 26px;
        }

        .heading-text h1 {
            font-family: "Playfair Display", serif;
            font-size: 31px;
            margin-bottom: 7px;
        }

        .heading-text p {
            color: #888;
            font-size: 13px;
        }

        .add-offer-btn {
            border: none;
            background: #d4af37;
            color: #000;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
        }

        .add-offer-btn:hover {
            background: #e5c65a;
        }

        /* ==========================================
           SUMMARY
        ========================================== */

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 22px;
        }

        .summary-card {
            background: #111111;
            border: 1px solid #292929;
            border-radius: 12px;
            padding: 19px;
        }

        .summary-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .summary-icon {
            width: 40px;
            height: 40px;
            border-radius: 9px;
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .summary-card h3 {
            font-size: 25px;
            margin-top: 13px;
        }

        .summary-card p {
            color: #888;
            font-size: 12px;
            margin-top: 3px;
        }

        /* ==========================================
           FILTERS
        ========================================== */

        .filter-box {
            background: #111111;
            border: 1px solid #292929;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 18px;
        }

        .filter-row {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) 190px 190px;
            gap: 12px;
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            font-size: 13px;
        }

        .search-box input,
        .filter-select {
            width: 100%;
            height: 44px;
            border: 1px solid #303030;
            background: #181818;
            color: #ddd;
            border-radius: 8px;
            outline: none;
            padding: 0 13px;
            font-size: 12px;
        }

        .search-box input {
            padding-left: 38px;
        }

        .search-box input:focus,
        .filter-select:focus {
            border-color: #d4af37;
        }

        .filter-select option {
            background: #111111;
        }

        /* ==========================================
           OFFERS TABLE
        ========================================== */

        .table-card {
            background: #111111;
            border: 1px solid #292929;
            border-radius: 12px;
            overflow: hidden;
        }

        .table-header {
            padding: 17px 19px;
            border-bottom: 1px solid #252525;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-header h2 {
            font-size: 15px;
        }

        .table-header span {
            color: #777;
            font-size: 11px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .table-wrapper::-webkit-scrollbar {
            display: none;
        }

        table {
            width: 100%;
            min-width: 1050px;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 13px 18px;
            background: #151515;
            color: #777;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            font-weight: 600;
        }

        td {
            padding: 15px 18px;
            border-top: 1px solid #222;
            font-size: 12px;
            color: #ccc;
            vertical-align: middle;
        }

        tbody tr:hover {
            background: #141414;
        }

        .offer-cell {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .offer-icon {
            width: 38px;
            height: 38px;
            min-width: 38px;
            border-radius: 9px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.22);
            color: #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .offer-info strong {
            display: block;
            color: #eeeeee;
            font-size: 12px;
        }

        .offer-info span {
            display: block;
            color: #777;
            font-size: 10px;
            margin-top: 3px;
        }

        .day-badge {
            display: inline-flex;
            align-items: center;
            padding: 5px 9px;
            border-radius: 6px;
            color: #d4af37;
            background: rgba(212, 175, 55, 0.08);
            font-size: 10px;
            font-weight: 700;
        }

        .discount-value {
            color: #d4af37;
            font-size: 15px;
            font-weight: 700;
        }

        .offer-date {
            color: #aaa;
            font-size: 11px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
        }

        .status.active {
            color: #73d69a;
            background: rgba(60, 180, 100, 0.1);
        }

        .status.inactive {
            color: #999;
            background: rgba(150, 150, 150, 0.1);
        }

        .action-group {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            width: 31px;
            height: 31px;
            border-radius: 7px;
            border: 1px solid #333;
            background: #181818;
            color: #aaa;
        }

        .action-btn:hover {
            color: #d4af37;
            border-color: #d4af37;
        }

        .action-btn.delete:hover {
            color: #ff7777;
            border-color: #c75c5c;
        }

        /* ==========================================
           MODAL
        ========================================== */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: min(620px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            scrollbar-width: none;
            background: #111111;
            border: 1px solid #333;
            border-radius: 14px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6);
        }

        .modal::-webkit-scrollbar {
            display: none;
        }

        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid #292929;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h3 {
            font-family: "Playfair Display", serif;
            font-size: 20px;
        }

        .modal-close {
            width: 34px;
            height: 34px;
            border: 1px solid #333;
            border-radius: 7px;
            background: #181818;
            color: #aaa;
        }

        .modal-close:hover {
            color: #d4af37;
            border-color: #d4af37;
        }

        .modal-body {
            padding: 20px;
        }

        /* ==========================================
           OFFER PREVIEW
        ========================================== */

        .offer-preview {
            background:
                linear-gradient(
                    135deg,
                    rgba(212, 175, 55, 0.13),
                    rgba(212, 175, 55, 0.03)
                );
            border: 1px solid rgba(212, 175, 55, 0.22);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .preview-label {
            color: #777;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 7px;
        }

        .preview-title {
            font-family: "Playfair Display", serif;
            font-size: 21px;
            color: #ffffff;
        }

        .preview-discount {
            color: #d4af37;
            font-size: 25px;
            font-weight: 700;
            margin-top: 7px;
        }

        .preview-description {
            color: #999;
            font-size: 11px;
            line-height: 1.6;
            margin-top: 6px;
        }

        /* ==========================================
           FORM
        ========================================== */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            color: #aaa;
            font-size: 11px;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            border: 1px solid #333;
            background: #181818;
            color: #ddd;
            border-radius: 7px;
            padding: 0 12px;
            outline: none;
            font-size: 12px;
        }

        .form-group input,
        .form-group select {
            height: 42px;
        }

        .form-group textarea {
            height: 90px;
            padding-top: 11px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #d4af37;
        }

        .form-group input[type="date"] {
            color-scheme: dark;
        }

        .discount-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: 16px;
        }

        .checkbox-row input {
            accent-color: #d4af37;
        }

        .checkbox-row label {
            color: #aaa;
            font-size: 11px;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid #292929;
            display: flex;
            justify-content: flex-end;
            gap: 9px;
        }

        .modal-btn {
            padding: 10px 15px;
            border-radius: 7px;
            border: 1px solid #333;
            background: #181818;
            color: #ccc;
            font-size: 12px;
        }

        .modal-btn.primary {
            border-color: #d4af37;
            background: #d4af37;
            color: #000;
            font-weight: 700;
        }

        /* ==========================================
           VIEW MODAL
        ========================================== */

        .view-offer-box {
            text-align: center;
            padding: 12px 0 22px;
        }

        .view-offer-icon {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            margin: 0 auto 13px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .view-offer-box h4 {
            font-family: "Playfair Display", serif;
            font-size: 21px;
        }

        .view-offer-box .view-discount {
            color: #d4af37;
            font-size: 28px;
            font-weight: 700;
            margin-top: 5px;
        }

        .view-offer-box p {
            color: #888;
            font-size: 11px;
            margin-top: 5px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .detail-item {
            background: #181818;
            border: 1px solid #252525;
            border-radius: 8px;
            padding: 13px;
        }

        .detail-item label {
            display: block;
            color: #777;
            font-size: 10px;
            margin-bottom: 5px;
        }

        .detail-item strong {
            color: #ddd;
            font-size: 12px;
        }

        .detail-item.full {
            grid-column: 1 / -1;
        }

        /* ==========================================
           MOBILE OVERLAY
        ========================================== */

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 78px 0 0 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 850;
        }

        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (max-width: 1100px) {

            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .filter-row {
                grid-template-columns: 1fr 1fr;
            }

            .search-box {
                grid-column: 1 / -1;
            }

        }

        @media (max-width: 767px) {

            .admin-header {
                height: 70px;
                padding: 0 14px;
            }

            .admin-logo {
                width: 40px;
                height: 40px;
                min-width: 40px;
                font-size: 16px;
            }

            .brand-name {
                font-size: 16px;
            }

            .brand-admin {
                font-size: 8px;
                letter-spacing: 1.5px;
            }

            .page-title {
                display: none;
            }

            .header-right {
                gap: 8px;
            }

            .notification-btn {
                width: 36px;
                height: 36px;
            }

            .profile-text {
                display: none;
            }

            .profile-avatar {
                width: 36px;
                height: 36px;
            }

            .mobile-menu-btn {
                display: flex;
            }

            .admin-sidebar {
                top: 70px;
                height: calc(100vh - 70px);
                width: 255px;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                z-index: 950;
            }

            .admin-sidebar.mobile-open {
                transform: translateX(0);
            }

            .admin-sidebar.collapsed {
                width: 255px;
            }

            .admin-sidebar.collapsed .sidebar-link {
                justify-content: flex-start;
                padding: 0 14px;
                gap: 14px;
            }

            .admin-sidebar.collapsed .sidebar-link span {
                display: inline;
            }

            .admin-sidebar.collapsed .sidebar-toggle i {
                transform: none;
            }

            .sidebar-toggle {
                right: 12px;
                top: 15px;
            }

            .sidebar-overlay {
                inset: 70px 0 0 0;
            }

            .sidebar-overlay.show {
                display: block;
            }

            .admin-main,
            .admin-sidebar.collapsed ~ .admin-main {
                margin-left: 0;
                padding: 94px 14px 30px;
            }

            .content-heading {
                align-items: flex-start;
                flex-direction: column;
            }

            .heading-text h1 {
                font-size: 27px;
            }

            .add-offer-btn {
                width: 100%;
            }

            .summary-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;

    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="admin-main">

    <section class="daily-offers-section">
        <div class="daily-offers-heading">
            <p>Select a promotional image for each day.</p>
            <span id="saveStatus" class="save-status"></span>
        </div>

        <div id="dailyOffersGrid" class="daily-offers-grid"></div>
    </section>

</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const API = "https://thebeautysalon.onrender.com/api/offers";
    const body = document.body;
    const sidebar = document.getElementById("adminSidebar");
    const sidebarToggle = document.getElementById("sidebarToggle");
    const mobileMenuBtn = document.getElementById("mobileMenuBtn");
    const sidebarOverlay = document.getElementById("sidebarOverlay");
    const dailyOffersGrid = document.getElementById("dailyOffersGrid");
    const saveStatus = document.getElementById("saveStatus");

    const days = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
    ];

    let offers = {};

    function closeMobileSidebar() {
        body.classList.remove("mobile-sidebar-open");
        if (sidebar) {
            sidebar.classList.remove("mobile-open");
        }
        if (sidebarOverlay) {
            sidebarOverlay.classList.remove("show");
        }
        if (mobileMenuBtn) {
            mobileMenuBtn.setAttribute("aria-expanded", "false");
        }
    }

    if (sidebarToggle) {
        sidebarToggle.addEventListener("click", function () {
            if (window.innerWidth <= 767) {
                closeMobileSidebar();
                return;
            }

            body.classList.toggle("sidebar-collapsed");
        });
    }

    if (mobileMenuBtn) {
        mobileMenuBtn.addEventListener("click", function () {
            body.classList.add("mobile-sidebar-open");
            if (sidebar) {
                sidebar.classList.add("mobile-open");
            }
            if (sidebarOverlay) {
                sidebarOverlay.classList.add("show");
            }
            mobileMenuBtn.setAttribute("aria-expanded", "true");
        });
    }

    if (sidebarOverlay) {
        sidebarOverlay.addEventListener("click", closeMobileSidebar);
    }

    document.querySelectorAll(".sidebar-link").forEach(function (link) {
        link.addEventListener("click", function () {
            if (window.innerWidth <= 767) {
                closeMobileSidebar();
            }
        });
    });

    window.addEventListener("resize", function () {
        if (window.innerWidth > 767) {
            closeMobileSidebar();
        }
    });

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function imageUrl(filename) {
        if (!filename) {
            return "";
        }

        if (filename.startsWith("http://") || filename.startsWith("https://")) {
            return filename;
        }

        return "../assets/images/offers/" + encodeURIComponent(filename);
    }

    function showStatus(message, type) {
        saveStatus.textContent = message || "";
        saveStatus.className = "save-status";

        if (type) {
            saveStatus.classList.add(type);
        }

        if (message) {
            window.setTimeout(function () {
                saveStatus.textContent = "";
                saveStatus.className = "save-status";
            }, 3000);
        }
    }

    function renderDays() {
        dailyOffersGrid.innerHTML = days.map(function (day) {
            const offer = offers[day] || null;
            const selectedImage = offer && offer.image ? imageUrl(offer.image) : "";

            return `
                <article class="day-offer-card" data-day="${day}">
                    <div class="day-offer-top">
                        <div class="day-name">${day}</div>
                        <span class="day-status ${offer && offer.status === "ACTIVE" ? "active" : "inactive"}">
                            ${offer && offer.status === "ACTIVE" ? "Saved" : "No Image"}
                        </span>
                    </div>

                    <label class="select-image-btn">
                        <i class="fa-solid fa-image"></i>
                        ${selectedImage ? "Change Image" : "Select Image"}
                        <input
                            type="file"
                            class="day-file-input"
                            data-day="${day}"
                            accept="image/jpeg,image/png,image/webp,image/gif"
                            hidden
                        >
                    </label>

                    <div class="day-image-actions">
                        ${selectedImage ? `
                            <button
                                type="button"
                                class="image-action-btn view-image-btn"
                                data-day="${day}"
                                title="View Image"
                                aria-label="View Image"
                            >
                                <i class="fa-regular fa-eye"></i>
                            </button>

                            <button
                                type="button"
                                class="image-action-btn delete-image-btn"
                                data-day="${day}"
                                title="Delete Image"
                                aria-label="Delete Image"
                            >
                                <i class="fa-regular fa-trash-can"></i>
                            </button>
                        ` : ""}
                    </div>

                    <div class="day-image-area">
                        ${selectedImage ? `
                            <img
                                src="${selectedImage}"
                                alt="${day} Offer"
                                class="day-preview-image"
                                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                            >

                            <div class="image-empty-fallback" style="display:none;">
                                <i class="fa-regular fa-image"></i>
                                <span>Image not found</span>
                            </div>
                        ` : `
                            <div class="image-empty-fallback">
                                <i class="fa-regular fa-image"></i>
                                <span>No image selected</span>
                            </div>
                        `}
                    </div>
                </article>
            `;
        }).join("");

        document.querySelectorAll(".day-file-input").forEach(function (input) {
            input.addEventListener("change", handleImageSelect);
        });

        document.querySelectorAll(".view-image-btn").forEach(function (button) {
            button.addEventListener("click", function () {
                const day = button.dataset.day;
                const offer = offers[day];

                if (offer && offer.image) {
                    window.open(imageUrl(offer.image), "_blank", "noopener,noreferrer");
                }
            });
        });

        document.querySelectorAll(".edit-image-btn").forEach(function (button) {
            button.addEventListener("click", function () {
                const day = button.dataset.day;
                const input = document.querySelector('.day-file-input[data-day="' + day + '"]');

                if (input) {
                    input.click();
                }
            });
        });

        document.querySelectorAll(".delete-image-btn").forEach(function (button) {
            button.addEventListener("click", function () {
                removeImage(button.dataset.day);
            });
        });
    }

    async function loadOffers() {
        dailyOffersGrid.innerHTML = `<div class="loading-box">Loading daily offers...</div>`;

        try {
            const response = await fetch(API);
            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.message || "Failed to load daily offers.");
            }

            offers = {};

            (Array.isArray(result.data) ? result.data : []).forEach(function (item) {
                offers[item.day] = item;
            });

            renderDays();
        } catch (error) {
            console.error("OFFER IMAGES LOAD ERROR:", error);
            dailyOffersGrid.innerHTML = `
                <div class="error-box">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>${escapeHtml(error.message || "Unable to load daily offers.")}</span>
                    <button type="button" id="retryOffersBtn">Retry</button>
                </div>
            `;

            document.getElementById("retryOffersBtn").addEventListener("click", loadOffers);
        }
    }

    async function handleImageSelect(event) {
        const input = event.target;
        const day = input.dataset.day;
        const file = input.files && input.files[0];

        if (!file) {
            return;
        }

        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp",
            "image/gif"
        ];

        if (!allowedTypes.includes(file.type)) {
            alert("Please select a JPG, PNG, WEBP or GIF image.");
            input.value = "";
            return;
        }

        if (file.size > 5 * 1024 * 1024) {
            alert("Image size must be 5 MB or less.");
            input.value = "";
            return;
        }

        const formData = new FormData();
        formData.append("image", file);
        formData.append("day", day);
        formData.append("status", "ACTIVE");

        showStatus("Saving " + day + "...", "saving");

        try {
            const response = await fetch(API + "/" + encodeURIComponent(day), {
                method: "PUT",
                body: formData
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.message || "Failed to save image.");
            }

            showStatus(day + " image saved successfully.", "success");
            await loadOffers();
        } catch (error) {
            console.error("OFFER IMAGE SAVE ERROR:", error);
            showStatus(error.message || "Failed to save image.", "error");
        } finally {
            input.value = "";
        }
    }

    async function removeImage(day) {
        if (!confirm("Remove the saved offer image for " + day + "?")) {
            return;
        }

        showStatus("Removing " + day + "...", "saving");

        try {
            const response = await fetch(API + "/" + encodeURIComponent(day), {
                method: "DELETE"
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.message || "Failed to remove image.");
            }

            showStatus(day + " image removed.", "success");
            await loadOffers();
        } catch (error) {
            console.error("OFFER IMAGE DELETE ERROR:", error);
            showStatus(error.message || "Failed to remove image.", "error");
        }
    }

    loadOffers();
});

const logoutBtn = document.getElementById("logoutBtn");

if (logoutBtn) {
    logoutBtn.addEventListener("click", function (event) {
        event.preventDefault();

        if (!confirm("Are you sure you want to logout?")) return;

        localStorage.removeItem("adminToken");
        localStorage.removeItem("adminEmail");
        localStorage.removeItem("adminId");

        sessionStorage.removeItem("adminToken");
        sessionStorage.removeItem("adminEmail");
        sessionStorage.removeItem("adminId");

        window.location.replace("../pages/admin-login.html");
    });
}
</script>

</body>
</html>
